<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Luma AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css" />
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --brand: #6C6EE5;
  --brand-2: #8FA8F8;
  --brand-3: #a78bfa;
  --border: rgba(255,255,255,0.18);
  --border-strong: rgba(255,255,255,0.28);
  --text-primary: #18181c;
  --text-secondary: #4a4a60;
  --text-muted: #8888a8;
  --font: 'Pretendard', -apple-system, sans-serif;
}

html, body { height: 100%; }

body {
  font-family: var(--font);
  color: var(--text-primary);
  display: flex;
  height: 100vh;
  overflow: hidden;
  position: relative;
}

/* ── ANIMATED GRADIENT BACKGROUND ── */
#bg-canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  background: linear-gradient(135deg, #f0f3ff 0%, #eaedff 20%, #f4f0ff 40%, #edf2ff 60%, #ebebff 80%, #f2f4ff 100%);
  background-size: 400% 400%;
  animation: bgShift 14s ease infinite;
}
@keyframes bgShift {
  0%   { background-position: 0% 50%; }
  25%  { background-position: 50% 0%; }
  50%  { background-position: 100% 50%; }
  75%  { background-position: 50% 100%; }
  100% { background-position: 0% 50%; }
}
#bg-canvas::before {
  content: '';
  position: absolute;
  width: 520px; height: 520px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(143,168,248,0.18) 0%, transparent 70%);
  top: -80px; left: -80px;
  animation: orb1 18s ease-in-out infinite alternate;
}
#bg-canvas::after {
  content: '';
  position: absolute;
  width: 420px; height: 420px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(167,139,250,0.14) 0%, transparent 70%);
  bottom: -60px; right: -60px;
  animation: orb2 22s ease-in-out infinite alternate;
}
@keyframes orb1 {
  from { transform: translate(0,0) scale(1); }
  to   { transform: translate(80px, 60px) scale(1.15); }
}
@keyframes orb2 {
  from { transform: translate(0,0) scale(1); }
  to   { transform: translate(-60px, -80px) scale(1.2); }
}

/* ── LAYOUT ── */
#app {
  position: relative;
  z-index: 1;
  display: flex;
  width: 100%;
  height: 100%;
}

/* ── SIDEBAR ── */
#sidebar {
  width: 200px;
  min-width: 200px;
  background: rgba(255,255,255,0.5);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 16px 12px 14px;
  gap: 4px;
  transition: width 0.25s ease, min-width 0.25s ease, padding 0.25s ease, opacity 0.25s ease;
  overflow: hidden;
}
#sidebar.collapsed {
  width: 0 !important;
  min-width: 0 !important;
  padding: 0 !important;
  opacity: 0;
}

.logo-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 6px 14px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 4px;
}
.logo-name {
  font-size: 15px;
  font-weight: 600;
  background: linear-gradient(135deg, var(--brand), var(--brand-2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: -0.3px;
}

.new-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 12px;
  border-radius: 10px;
  border: 1px solid var(--border-strong);
  background: rgba(255,255,255,0.6);
  cursor: pointer;
  font-family: var(--font);
  font-size: 13px;
  font-weight: 500;
  color: var(--brand);
  transition: background 0.15s;
}
.new-btn:hover { background: rgba(255,255,255,0.85); }
.new-btn svg { width: 15px; height: 15px; stroke: var(--brand); }

.sidebar-hint {
  font-size: 11px;
  font-weight: 500;
  color: var(--text-muted);
  padding: 12px 6px 4px;
  letter-spacing: 0.4px;
  text-transform: uppercase;
}

.sidebar-empty {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding-bottom: 24px;
}
.sidebar-empty svg { width: 28px; height: 28px; stroke: var(--text-muted); opacity: 0.5; }
.sidebar-empty p { font-size: 12px; color: var(--text-muted); text-align: center; line-height: 1.6; }

.sidebar-chat-list { flex: 1; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }

.chat-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  border-radius: 8px;
  font-size: 13px;
  color: var(--text-secondary);
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: background 0.12s;
  position: relative;
}
.chat-item:hover { background: rgba(108,110,229,0.1); color: var(--brand); }
.chat-item.active { background: rgba(108,110,229,0.12); color: var(--brand); }
.chat-item svg { width: 13px; height: 13px; flex-shrink: 0; stroke: currentColor; }
.chat-item-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chat-item-del {
  display: none;
  background: none;
  border: none;
  cursor: pointer;
  padding: 2px;
  color: var(--text-muted);
  flex-shrink: 0;
}
.chat-item:hover .chat-item-del { display: flex; align-items: center; }
.chat-item-del:hover { color: #e53935; }
.chat-item-del svg { width: 12px; height: 12px; stroke: currentColor; }

.sidebar-bottom {
  border-top: 1px solid var(--border);
  padding-top: 12px;
}
.user-row {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 7px 8px;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.12s;
}
.user-row:hover { background: rgba(108,110,229,0.1); }
.avatar {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--brand-2), var(--brand));
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 600; color: #fff;
  flex-shrink: 0;
}
.user-name { font-size: 13px; color: var(--text-secondary); }

/* ── MAIN ── */
#main {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: rgba(255,255,255,0.38);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  overflow: hidden;
  position: relative;
}
#main.is-welcome #chat-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  padding-bottom: 60px;
}
#main.is-welcome #scroll-area { display: none; }
#main.is-welcome #welcome-center {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 680px;
  padding: 0 24px;
  animation: welcomeFadeIn 0.7s ease both;
  gap: 0;
}
#main.is-welcome #input-wrap {
  position: static;
  background: transparent;
  border-top: none;
  padding: 0;
  width: 100%;
}
#main.is-chat #chat-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
#main.is-chat #welcome-center { display: none; }
#main.is-chat #scroll-area {
  flex: 1;
  overflow-y: auto;
  padding: 32px 0 16px;
  scroll-behavior: smooth;
}
#main.is-chat #scroll-area::-webkit-scrollbar { width: 3px; }
#main.is-chat #scroll-area::-webkit-scrollbar-thumb { background: rgba(108,110,229,0.2); border-radius: 2px; }
#main.is-chat #input-wrap {
  position: static;
  background: rgba(255,255,255,0.3);
  border-top: none;
  padding: 10px 20px 38px;
}

/* topbar */
#topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 11px 18px;
  border-bottom: 1px solid var(--border);
  background: rgba(255,255,255,0.3);
}
.model-pill {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 11px;
  border-radius: 20px;
  border: 1px solid var(--border-strong);
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  cursor: pointer;
  background: rgba(255,255,255,0.55);
  font-family: var(--font);
  transition: background 0.12s;
}
.model-pill:hover { background: rgba(255,255,255,0.85); }
.model-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--brand); }
.model-pill svg { width: 11px; height: 11px; stroke: var(--text-muted); }
.topbar-right { display: flex; gap: 6px; }
.icon-btn {
  width: 30px; height: 30px;
  border-radius: 7px;
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.45);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: background 0.12s;
}
.icon-btn:hover { background: rgba(255,255,255,0.85); }
.icon-btn svg { width: 15px; height: 15px; stroke: var(--text-secondary); }

#chat-area { display: flex; flex-direction: column; }

/* welcome */
@keyframes welcomeFadeIn {
  from { opacity: 0; transform: translateY(18px); }
  to   { opacity: 1; transform: translateY(0); }
}
#welcome-center {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}
.welcome-logo {
  width: 288px; height: 288px; object-fit: contain;
  animation: logoFloat 4s ease-in-out infinite;
  margin-bottom: -60px;
  margin-top: -80px;
}
@keyframes logoFloat {
  0%, 100% { transform: translateY(-30px); }
  50%       { transform: translateY(-36px); }
}
.welcome-title {
  font-size: 26px;
  font-weight: 600;
  color: var(--text-primary);
  letter-spacing: -0.5px;
  animation: welcomeFadeIn 0.7s 0.1s ease both;
  margin-top: -30px;
  position: relative;
  z-index: 1;
}
.welcome-sub {
  font-size: 14px;
  color: var(--text-secondary);
  text-align: center;
  line-height: 1.65;
  max-width: 340px;
  margin-bottom: 32px;
  animation: welcomeFadeIn 0.7s 0.2s ease both;
  position: relative;
  z-index: 1;
}

/* messages */
.msg-wrap { max-width: 640px; margin: 0 auto; padding: 20px 28px; }
.msg { display: flex; margin-bottom: 4px; animation: msgIn 0.35s cubic-bezier(0.34,1.56,0.64,1) both; }
.msg.user { justify-content: flex-end; }
.msg.ai { justify-content: flex-start; }
@keyframes msgIn {
  from { opacity: 0; transform: translateY(12px) scale(0.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes msgInUser {
  from { opacity: 0; transform: translateX(16px) scale(0.97); }
  to   { opacity: 1; transform: translateX(0) scale(1); }
}
.msg.user .bubble { animation: msgInUser 0.32s cubic-bezier(0.34,1.4,0.64,1) both; }
.msg.ai  .bubble  { animation: msgIn 0.32s cubic-bezier(0.34,1.4,0.64,1) both; }

.bubble {
  font-size: 14px;
  line-height: 1.75;
  font-family: var(--font);
}
.bubble.ai {
  max-width: 90%;
  color: var(--text-primary);
  background: none;
  border: none;
  padding: 0;
}
/* 마크다운 렌더링 스타일 */
.bubble.ai p { margin: 0 0 10px; }
.bubble.ai p:last-child { margin-bottom: 0; }
.bubble.ai h1,.bubble.ai h2,.bubble.ai h3,.bubble.ai h4 { font-weight: 600; margin: 14px 0 6px; line-height: 1.4; color: var(--text-primary); }
.bubble.ai h1 { font-size: 18px; } .bubble.ai h2 { font-size: 16px; } .bubble.ai h3 { font-size: 15px; }
.bubble.ai ul, .bubble.ai ol { padding-left: 20px; margin: 6px 0 10px; }
.bubble.ai li { margin-bottom: 4px; }
.bubble.ai code { background: rgba(108,110,229,0.1); color: var(--brand); border-radius: 4px; padding: 1px 5px; font-size: 13px; font-family: 'Menlo','Consolas',monospace; }
.bubble.ai pre { background: rgba(24,24,28,0.05); border-radius: 10px; padding: 14px 16px; margin: 8px 0; overflow-x: auto; }
.bubble.ai pre code { background: none; padding: 0; color: var(--text-primary); font-size: 13px; }
.bubble.ai blockquote { border-left: 3px solid var(--brand); padding-left: 12px; color: var(--text-secondary); margin: 8px 0; }
.bubble.ai table { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: 13px; }
.bubble.ai th, .bubble.ai td { border: 1px solid var(--border-strong); padding: 6px 10px; }
.bubble.ai th { background: rgba(108,110,229,0.08); font-weight: 600; }
.bubble.ai a { color: var(--brand); text-decoration: underline; }
.bubble.ai strong { font-weight: 600; }
.bubble.ai em { font-style: italic; }
.bubble.ai hr { border: none; border-top: 1px solid var(--border); margin: 10px 0; }
.bubble.user {
  max-width: 68%;
  background: var(--brand);
  color: #fff;
  border-radius: 18px 18px 4px 18px;
  padding: 9px 15px;
  font-size: 14px;
}

/* 메시지 액션 버튼 (복사, 좋아요) */
.msg-actions {
  display: flex;
  gap: 4px;
  margin-bottom: 12px;
  opacity: 0;
  transition: opacity 0.15s;
}
.msg-wrap:hover .msg-actions { opacity: 1; }
.msg-action-btn {
  background: none;
  border: none;
  cursor: pointer;
  padding: 4px 6px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  color: var(--text-muted);
  font-family: var(--font);
  transition: background 0.12s, color 0.12s;
}
.msg-action-btn:hover { background: rgba(108,110,229,0.1); color: var(--brand); }
.msg-action-btn.liked { color: #e53935; }
.msg-action-btn.copied { color: #2e7d32; }
.msg-action-btn svg { width: 13px; height: 13px; stroke: currentColor; flex-shrink: 0; }

/* thinking */
.thinking-row { display: flex; justify-content: flex-start; margin-bottom: 16px; animation: msgIn 0.3s ease both; }
.thinking-bubble {
  padding: 0;
  background: none;
  border: none;
  display: flex;
  align-items: center;
  gap: 8px;
}
.dots { display: flex; gap: 5px; align-items: center; }
.dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--brand);
  animation: dotBounce 1.1s infinite ease-in-out;
}
.dot:nth-child(1) { animation-delay: 0s; }
.dot:nth-child(2) { animation-delay: 0.18s; }
.dot:nth-child(3) { animation-delay: 0.36s; }
@keyframes dotBounce {
  0%, 80%, 100% { opacity: 0.2; transform: translateY(0) scale(0.8); }
  40% { opacity: 1; transform: translateY(-5px) scale(1.1); }
}
.thinking-label { font-size: 13px; color: var(--brand); font-weight: 500; font-family: var(--font); }




/* ── INPUT ── */
#input-wrap {
  flex-shrink: 0;
  padding: 10px 20px 18px;
}
.input-inner { max-width: 640px; margin: 0 auto; }
.input-box {
  display: flex;
  align-items: flex-end;
  gap: 10px;
  background: rgba(255,255,255,0.75);
  border: 1px solid var(--border-strong);
  border-radius: 14px 14px 14px 14px;
  border-bottom-right-radius: 0;
  padding: 8px 12px;
  min-height: 48px;
  backdrop-filter: blur(10px);
  transition: border-color 0.2s, background 0.2s;
}
.input-box:focus-within {
  border-color: rgba(108,110,229,0.45);
  background: rgba(255,255,255,0.95);
}
.input-box:focus-within .send-model-pill {
  border-left: 1px solid rgba(108,110,229,0.45);
  border-right: 1px solid rgba(108,110,229,0.45);
  border-bottom: 1px solid rgba(108,110,229,0.45);
  border-top: none;
}
#msg-input {
  flex: 1;
  border: none;
  outline: none;
  background: transparent;
  font-size: 14px;
  font-family: var(--font);
  color: var(--text-primary);
  resize: none;
  line-height: 1.55;
  max-height: 130px;
  min-height: 22px;
  padding: 4px 0;
  align-self: flex-end;
  overflow: hidden;
  margin-bottom: 2px;
}
#msg-input::placeholder { color: var(--text-muted); }
.send-btn {
  width: 32px; height: 32px;
  border-radius: 9px;
  background: var(--brand);
  border: none;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: opacity 0.15s, transform 0.15s;
  align-self: flex-end;
  margin-bottom: 1px;
}
.send-btn:hover { opacity: 0.85; transform: scale(1.06); }
.send-btn:active { transform: scale(0.9); }
.send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
.send-btn svg { width: 15px; height: 15px; stroke: #fff; }

.input-hint { font-size: 11px; color: var(--text-muted); text-align: center; margin-top: 8px; font-family: var(--font); }

/* ── SIDEBAR TOGGLE ── */
#sidebar-toggle {
  width: 30px; height: 30px;
  border-radius: 7px;
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.45);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: background 0.12s;
  flex-shrink: 0;
}
#sidebar-toggle:hover { background: rgba(255,255,255,0.85); }
#sidebar-toggle svg { width: 15px; height: 15px; stroke: var(--text-secondary); }

/* ── FILE UPLOAD ── */
.file-btn {
  width: 32px; height: 32px;
  border-radius: 9px;
  background: transparent;
  border: none;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: background 0.15s;
  color: var(--text-muted);
  align-self: flex-end;
  margin-bottom: 1px;
}
.file-btn:hover { background: rgba(108,110,229,0.08); }
.file-btn svg { width: 15px; height: 15px; stroke: var(--text-muted); flex-shrink: 0; }
#file-preview {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  max-height: 0;
  overflow: hidden;
  opacity: 0;
  transition: max-height 0.28s cubic-bezier(0.4,0,0.2,1), opacity 0.2s ease, padding 0.2s ease;
  padding: 0 12px;
}
#file-preview.has-files {
  max-height: 100px;
  opacity: 1;
  padding: 6px 12px 0;
}
.file-tag {
  display: flex;
  align-items: center;
  gap: 5px;
  background: rgba(108,110,229,0.1);
  border: none;
  border-radius: 6px 6px 0 0;
  padding: 5px 8px 9px;
  font-size: 12px;
  color: var(--brand);
}
.file-tag button {
  background: none; border: none; cursor: pointer;
  color: var(--brand); font-size: 13px; line-height: 1;
  padding: 0; display: flex; align-items: center;
}

/* ── SEND WRAP + MODEL PILL ── */
#main.is-welcome #input-wrap .input-inner { max-width: 100%; }
#main.is-welcome .input-box { background: rgba(255,255,255,0.88); box-shadow: none; }
.welcome-model-pill { margin-bottom: 12px; cursor: pointer; transition: background 0.12s; }
.welcome-model-pill:hover { background: rgba(255,255,255,0.85); }
#topbar { justify-content: space-between; }
.send-wrap {
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: flex-end;
  align-self: flex-end;
}
.send-model-pill {
  position: absolute;
  top: calc(100% + 7px);
  right: -13px;
  white-space: nowrap;
  cursor: pointer;
  background: rgba(255,255,255,0.96);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  box-shadow: none;
  border: none;
  border-radius: 0 0 20px 20px;
  padding: 5px 11px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  font-family: var(--font);
  display: flex;
  align-items: center;
  gap: 6px;
  z-index: 10;
}
.send-model-pill .model-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--brand); }
.send-model-pill svg { width: 11px; height: 11px; stroke: var(--text-muted); }
#main.is-chat .send-model-pill { display: none; }

/* ── ANIMATIONS ── */
@keyframes chatFadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}
#main.is-chat #scroll-area { animation: chatFadeIn 0.3s ease both; }

/* ── STATUS BAR ── */
#status-bar {
  font-size: 11px;
  text-align: center;
  color: #888;
  padding: 3px 12px;
  background: rgba(255,255,255,0.2);
  display: none;
}
#status-bar.visible { display: block; }
#status-bar.error { color: #e53935; }
#status-bar.ok { color: #2e7d32; }

/* 연결 상태 도트 */
.conn-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: #ccc;
  display: inline-block;
  margin-right: 5px;
  vertical-align: middle;
}
.conn-dot.ok { background: #43a047; }
.conn-dot.err { background: #e53935; }
</style>
</head>

              </svg>
            </button>
            <div class="send-model-pill">
              <span class="model-dot"></span>
              Luma 1.0
              <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"/>
              </svg>
            </div>
          </div>
        </div>
        <div class="input-hint">Luma AI는 실수할 수 있어요. 중요한 정보는 꼭 확인하세요.</div>
      </div>
    </div>
  </div>
</div>

<script>
// ── marked 설정 ───────────────────────────────────────────────
marked.setOptions({ breaks: true, gfm: true });

// ── KaTeX 렌더 헬퍼 ──────────────────────────────────────────
function renderKatex(el) {
  if (typeof renderMathInElement !== 'undefined') {
    renderMathInElement(el, {
      delimiters: [
        { left: '$$', right: '$$', display: true },
        { left: '$', right: '$', display: false },
        { left: '\\(', right: '\\)', display: false },
        { left: '\\[', right: '\\]', display: true }
      ],
      throwOnError: false
    });
  }
}

// ── 설정 ──────────────────────────────────────────────────────
const API_URL = 'https://chubby-feet-relax.loca.lt/chat';  // localtunnel URL을 여기에 입력하세요
const STORAGE_KEY = 'luma_chats_v2';

// ── 상태 ──────────────────────────────────────────────────────
const chatArea    = document.getElementById('scroll-area');
const chatList    = document.getElementById('chat-list');
const mainEl      = document.getElementById('main');
const sendBtnEl   = document.getElementById('send-btn');
const statusBar   = document.getElementById('status-bar');
let busy = false;
let currentChatId = null;   // 현재 대화 ID
let chats = {};              // { id: { title, messages: [{role,content}] } }

// ── 로컬스토리지 ──────────────────────────────────────────────
function loadChats() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    chats = raw ? JSON.parse(raw) : {};
  } catch(e) { chats = {}; }
}

function saveChats() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(chats)); } catch(e) {}
}

function genId() {
  return 'c' + Date.now() + Math.random().toString(36).slice(2,6);
}

// ── 연결 상태 표시 ────────────────────────────────────────────
async function checkConnection() {
  try {
    const res = await fetch(API_URL + '?bypass=true', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'bypass-tunnel-reminder': 'true' },
      body: JSON.stringify({ message: 'ping', history: [] }),
      signal: AbortSignal.timeout(6000)
    });
  } catch(e) {}
}

// ── 상태바 ────────────────────────────────────────────────────
let statusTimer = null;
function showStatus(msg, type = '', duration = 3000) {
  statusBar.textContent = msg;
  statusBar.className = 'visible' + (type ? ' ' + type : '');
  if (statusTimer) clearTimeout(statusTimer);
  if (duration > 0) statusTimer = setTimeout(() => { statusBar.className = ''; }, duration);
}

// ── 화면 모드 ─────────────────────────────────────────────────
function setWelcomeMode() {
  mainEl.classList.remove('is-chat');
  mainEl.classList.add('is-welcome');
  const wc = document.getElementById('welcome-center');
  const iw = document.getElementById('input-wrap');
  if (wc && iw && !wc.contains(iw)) wc.appendChild(iw);
  if (wc) { wc.style.opacity=''; wc.style.transform=''; wc.style.transition=''; }
  if (iw) { iw.style.transform=''; iw.style.opacity=''; iw.style.transition=''; }
}

function setChatMode() {
  const iw = document.getElementById('input-wrap');
  const ca = document.getElementById('chat-area');
  const wc = document.getElementById('welcome-center');
  if (wc) {
    wc.style.transition = 'opacity 0.2s ease, transform 0.2s ease';
    wc.style.opacity = '0';
    wc.style.transform = 'translateY(-8px)';
  }
  setTimeout(() => {
    mainEl.classList.remove('is-welcome');
    mainEl.classList.add('is-chat');
    if (iw && ca && ca.nextSibling !== iw) mainEl.insertBefore(iw, ca.nextSibling);
    iw.style.transition = 'none';
    iw.style.transform = 'translateY(30px)';
    iw.style.opacity = '0';
    setTimeout(() => {
      iw.style.transition = 'transform 0.38s cubic-bezier(0.34,1.2,0.64,1), opacity 0.28s ease';
      iw.style.transform = 'translateY(0)';
      iw.style.opacity = '1';
    }, 20);
  }, 180);
}

function removeWelcome() {
  if (mainEl.classList.contains('is-welcome')) setChatMode();
}

// ── 메시지 렌더링 ─────────────────────────────────────────────
function addMessage(text, role) {
  removeWelcome();
  const wrap = document.createElement('div');
  wrap.className = 'msg-wrap';

  const row = document.createElement('div');
  row.className = 'msg ' + role;
  const bubble = document.createElement('div');
  bubble.className = 'bubble ' + (role === 'ai' ? 'ai' : 'user');
  if (role === 'ai') {
    bubble.innerHTML = marked.parse(text);
    renderKatex(bubble);
  } else {
    bubble.textContent = text;
  }
  row.appendChild(bubble);
  wrap.appendChild(row);

  // AI 메시지에만 액션 버튼 (복사, 좋아요)
  if (role === 'ai') {
    const actions = document.createElement('div');
    actions.className = 'msg-actions';

    // 복사 버튼
    const copyBtn = document.createElement('button');
    copyBtn.className = 'msg-action-btn';
    copyBtn.title = '복사';
    const copyIconSVG = `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>`;
    const checkIconSVG = `<svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
    copyBtn.innerHTML = copyIconSVG;
    copyBtn.addEventListener('click', () => {
      const doCopy = () => {
        copyBtn.innerHTML = checkIconSVG;
        setTimeout(() => {
          copyBtn.innerHTML = copyIconSVG;
        }, 2000);
      };
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(doCopy).catch(() => {
          const ta = document.createElement('textarea');
          ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
          document.body.appendChild(ta); ta.select();
          document.execCommand('copy'); document.body.removeChild(ta); doCopy();
        });
      } else {
        const ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); document.body.removeChild(ta); doCopy();
      }
    });

    // 좋아요 버튼
    const likeBtn = document.createElement('button');
    likeBtn.className = 'msg-action-btn';
    likeBtn.title = '좋아요';
    const likeIconSVG = `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 9V5a3 3 0 00-3-3l-4 9v11h11.28a2 2 0 002-1.7l1.38-9a2 2 0 00-2-2.3H14z"/><path d="M7 22H4a2 2 0 01-2-2v-7a2 2 0 012-2h3"/></svg>`;
    const likeCheckSVG = `<svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
    likeBtn.innerHTML = likeIconSVG;
    let liked = false;
    likeBtn.addEventListener('click', () => {
      liked = !liked;
      likeBtn.innerHTML = liked ? likeCheckSVG : likeIconSVG;
    });

    actions.appendChild(copyBtn);
    actions.appendChild(likeBtn);
    wrap.appendChild(actions);
  }

  chatArea.appendChild(wrap);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function showThinking() {
  removeWelcome();
  const wrap = document.createElement('div');
  wrap.className = 'msg-wrap';
  wrap.id = 'thinking-wrap';
  const row = document.createElement('div');
  row.className = 'thinking-row';
  const bubble = document.createElement('div');
  bubble.className = 'thinking-bubble';
  bubble.innerHTML = '<div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div><span class="thinking-label" id="thinking-label">생각하는 중...</span>';
  row.appendChild(bubble);
  wrap.appendChild(row);
  chatArea.appendChild(wrap);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function updateThinking(t) { const el = document.getElementById('thinking-label'); if (el) el.textContent = t; }
function removeThinking()   { const el = document.getElementById('thinking-wrap'); if (el) el.remove(); }




// ── 사이드바 채팅 목록 ────────────────────────────────────────
function renderSidebar() {
  const emptyEl = chatList.querySelector('.sidebar-empty');
  const ids = Object.keys(chats).sort((a,b) => (chats[b].updatedAt||0) - (chats[a].updatedAt||0));

  // 기존 chat-item 제거
  chatList.querySelectorAll('.chat-item').forEach(el => el.remove());

  if (ids.length === 0) {
    if (!emptyEl) {
      const div = document.createElement('div');
      div.className = 'sidebar-empty';
      div.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg><p>아직 대화가 없어요.<br/>새 채팅을 시작해보세요.</p>`;
      chatList.appendChild(div);
    }
    return;
  }
  if (emptyEl) emptyEl.remove();

  ids.forEach(id => {
    const chat = chats[id];
    const item = document.createElement('div');
    item.className = 'chat-item' + (id === currentChatId ? ' active' : '');
    item.dataset.id = id;

    const label = document.createElement('span');
    label.className = 'chat-item-label';
    label.textContent = chat.title || '새 대화';

    const delBtn = document.createElement('button');
    delBtn.className = 'chat-item-del';
    delBtn.title = '삭제';
    delBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`;
    delBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      deleteChat(id);
    });

    item.appendChild(document.createTextNode('')); // icon placeholder
    item.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px;stroke:currentColor;flex-shrink:0"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>`;
    item.appendChild(label);
    item.appendChild(delBtn);

    item.addEventListener('click', () => loadChat(id));
    chatList.appendChild(item);
  });
}

function deleteChat(id) {
  delete chats[id];
  saveChats();
  if (currentChatId === id) {
    currentChatId = null;
    chatArea.innerHTML = '';
    setWelcomeMode();
  }
  renderSidebar();
}

// ── 채팅 로드/저장 ────────────────────────────────────────────
function loadChat(id) {
  currentChatId = id;
  const chat = chats[id];
  if (!chat) return;

  chatArea.innerHTML = '';
  removeThinking();
  setChatMode();

  setTimeout(() => {
    chat.messages.forEach(msg => {
      addMessage(msg.content, msg.role === 'user' ? 'user' : 'ai');
    });
    chatArea.scrollTop = chatArea.scrollHeight;
  }, 200);

  renderSidebar();
}

function saveCurrentMessage(role, content) {
  if (!currentChatId) return;
  if (!chats[currentChatId]) return;
  chats[currentChatId].messages.push({ role, content });
  chats[currentChatId].updatedAt = Date.now();
  saveChats();
}

// ── API 호출 ──────────────────────────────────────────────────
async function callServer(message, history) {
  const res = await fetch(API_URL + '?bypass=true', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'bypass-tunnel-reminder': 'true' },
    body: JSON.stringify({ message, history }),
    signal: AbortSignal.timeout(40000)
  });
  if (!res.ok) throw new Error('http error ' + res.status);
  const data = await res.json();
  const reply = data.response || data.text || '';
  if (!reply) throw new Error('empty response');
  return reply;
}

// ── 메인 전송 ─────────────────────────────────────────────────
async function sendMsg() {
  if (busy) return;
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text) return;

  // 새 채팅 ID 생성 (처음 메시지면)
  if (!currentChatId) {
    currentChatId = genId();
    chats[currentChatId] = {
      title: text.slice(0, 30) + (text.length > 30 ? '…' : ''),
      messages: [],
      updatedAt: Date.now()
    };
    saveChats();
    renderSidebar();
  }

  const thisChatId = currentChatId;

  // 히스토리 구성 ([[user, ai], ...])
  const history = [];
  const msgs = chats[thisChatId].messages;
  for (let i = 0; i < msgs.length - 1; i += 2) {
    if (msgs[i] && msgs[i+1]) history.push([msgs[i].content, msgs[i+1].content]);
  }

  input.value = '';
  input.style.height = 'auto';
  busy = true;
  sendBtnEl.disabled = true;
  attachedFiles.length = 0;
  renderFileTags();

  addMessage(text, 'user');
  saveCurrentMessage('user', text);

  showThinking();
  updateThinking('생각하는 중...');

  try {
    const answer = await callServer(text, history);
    removeThinking();
    saveCurrentMessage('assistant', answer);
    if (currentChatId === thisChatId) {
      addMessage(answer, 'ai');
      renderSidebar();
    }
  } catch(e) {
    removeThinking();
    if (currentChatId === thisChatId) {
      addMessage('서버와 연결할 수 없어요. 잠시 후 다시 시도해 주세요.', 'ai');
    }
  } finally {
    busy = false;
    sendBtnEl.disabled = false;
    input.focus();
  }
}

// ── 새 채팅 ───────────────────────────────────────────────────
function newChat() {
  currentChatId = null;
  chatArea.innerHTML = '';
  busy = false;
  sendBtnEl.disabled = false;
  renderSidebar();
  setWelcomeMode();
}

// ── 입력 유틸 ─────────────────────────────────────────────────
function resize(el) {
  el.style.overflow = 'hidden';
  el.style.height = 'auto';
  const scrollH = el.scrollHeight;
  const maxH = 140;
  if (scrollH >= maxH) {
    el.style.height = maxH + 'px';
    el.style.overflow = 'auto';
  } else {
    el.style.height = scrollH + 'px';
    el.style.overflow = 'hidden';
  }
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('collapsed');
}

// ── 파일 첨부 ─────────────────────────────────────────────────
const attachedFiles = [];

function handleFileSelect(input) {
  Array.from(input.files).forEach(file => {
    if (attachedFiles.length < 2) attachedFiles.push(file);
  });
  renderFileTags();
  input.value = '';
}

function truncateName(name) {
  if (name.length <= 10) return name;
  const ext = name.includes('.') ? '.' + name.split('.').pop() : '';
  const base = name.slice(0, 10 - ext.length - 3);
  return base + '...' + ext;
}

function renderFileTags() {
  const preview = document.getElementById('file-preview');
  preview.innerHTML = '';
  preview.classList.toggle('has-files', attachedFiles.length > 0);
  attachedFiles.forEach((file, idx) => {
    const tag = document.createElement('div');
    tag.className = 'file-tag';
    tag.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:12px;height:12px;stroke:currentColor;flex-shrink:0"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      <span title="${file.name}">${truncateName(file.name)}</span>
      <button onclick="removeFile(${idx})" title="삭제">×</button>`;
    preview.appendChild(tag);
  });
}

function removeFile(idx) {
  attachedFiles.splice(idx, 1);
  renderFileTags();
}

// ── 초기화 ────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', function() {
  loadChats();
  renderSidebar();
  setWelcomeMode();
  // 서버 연결 자동 체크
  checkConnection();
});
</script>
</body>
</html>
